<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCouple - Meta Semanal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --andressa-color: #EC4899;
            --welton-color: #3B82F6;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .header p {
            margin: 6px 0 0 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-badge {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .andressa-badge {
            background-color: #FCE7F3;
            color: var(--andressa-color);
        }

        .welton-badge {
            background-color: #DBEAFE;
            color: var(--welton-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1.5px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-andressa { background-color: var(--andressa-color); }
        .btn-welton { background-color: var(--welton-color); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background-color: #F9FAFB;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #6B7280;
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }

        .chart-container {
            position: relative;
            height: 220px;
            margin-top: 10px;
        }

        .clear-btn {
            background: transparent;
            color: #9CA3AF;
            font-size: 0.75rem;
            padding: 4px 8px;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👩‍❤️‍👨 FitCouple</h1>
        <p>Acompanhamento Integrado de Emagrecimento</p>
    </div>

    <!-- ANDRESSA -->
    <div class="card">
        <div class="card-title">
            <span>🌸 Andressa</span>
            <span class="meta-badge andressa-badge">Meta: -800g / sem</span>
        </div>
        
        <div class="input-group">
            <input type="number" id="weightAndressa" step="0.1" placeholder="Peso atual (kg)">
            <button class="btn-andressa" onclick="addWeight('Andressa')">Salvar</button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Perda Total</span>
                <span class="stat-value" id="totalAndressa">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Última Semana</span>
                <span class="stat-value" id="weeklyAndressa">-</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="chartAndressa"></canvas>
        </div>
    </div>

    <!-- WELTON -->
    <div class="card">
        <div class="card-title">
            <span>⚡ Welton</span>
            <span class="meta-badge welton-badge">Meta: -900g / sem</span>
        </div>
        
        <div class="input-group">
            <input type="number" id="weightWelton" step="0.1" placeholder="Peso atual (kg)">
            <button class="btn-welton" onclick="addWeight('Welton')">Salvar</button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Perda Total</span>
                <span class="stat-value" id="totalWelton">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Última Semana</span>
                <span class="stat-value" id="weeklyWelton">-</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="chartWelton"></canvas>
        </div>
    </div>
</div>

<script>
    const metas = {
        Andressa: 0.8,
        Welton: 0.9
    };

    let data = JSON.parse(localStorage.getItem('fitCoupleData')) || {
        Andressa: [],
        Welton: []
    };

    const charts = {};

    function initChart(user, color) {
        const ctx = document.getElementById(`chart${user}`).getContext('2d');
        charts[user] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data[user].map(entry => entry.date),
                datasets: [{
                    label: 'Peso (kg)',
                    data: data[user].map(entry => entry.weight),
                    borderColor: color,
                    backgroundColor: color + '22',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointBackgroundColor: color
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });
        updateStats(user);
    }

    function addWeight(user) {
        const input = document.getElementById(`weight${user}`);
        const weight = parseFloat(input.value);
        if (!weight) return;

        const dateStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        data[user].push({ date: dateStr, weight: weight });
        
        localStorage.setItem('fitCoupleData', JSON.stringify(data));
        
        charts[user].data.labels.push(dateStr);
        charts[user].data.datasets[0].data.push(weight);
        charts[user].update();

        input.value = '';
        updateStats(user);
    }

    function updateStats(user) {
        const totalElem = document.getElementById(`total${user}`);
        const weeklyElem = document.getElementById(`weekly${user}`);
        const userLogs = data[user];
        
        if (userLogs.length === 0) {
            totalElem.innerText = 'Sem dados';
            weeklyElem.innerText = 'Sem dados';
            return;
        }

        if (userLogs.length === 1) {
            totalElem.innerText = '1º Registro';
            weeklyElem.innerText = 'Aguardando 2º';
            return;
        }

        const initial = userLogs[0].weight;
        const current = userLogs[userLogs.length - 1].weight;
        const previous = userLogs[userLogs.length - 2].weight;

        const totalDiff = (initial - current).toFixed(1);
        const weeklyDiff = (previous - current).toFixed(1);

        totalElem.innerText = totalDiff > 0 ? `-${totalDiff} kg` : `+${Math.abs(totalDiff)} kg`;
        
        const targetGrams = metas[user] * 1000;
        const achievedGrams = (weeklyDiff * 1000).toFixed(0);
        
        if (weeklyDiff > 0) {
            weeklyElem.innerText = `-${weeklyDiff} kg (${achievedGrams}/${targetGrams}g)`;
        } else {
            weeklyElem.innerText = `${weeklyDiff} kg`;
        }
    }

    window.onload = () => {
        initChart('Andressa', '#EC4899');
        initChart('Welton', '#3B82F6');
    };
</script>

</body>
</html>
